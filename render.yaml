services:
  - type: web
    name: inscricoes-ibtech
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inscricoes-ibtech-db
          property: connectionString
databases:
  - name: inscricoes-ibtech-db
    plan: free
    region: virginia
